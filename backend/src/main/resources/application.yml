spring:
  application:
    name: backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/lms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        hbm2ddl:
          halt_on_error: false
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: true

management:
  health:
    mail:
      enabled: false

server:
  port: 8080

jwt:
  secret: "${JWT_SECRET:lms-dev-only-secret-key-must-be-at-least-256-bits-long-for-hs256}"
  access-token-minutes: 60
  refresh-token-days: 30

cors:
  allowed-origins: "${CORS_ORIGINS:http://localhost:3000}"

oauth2:
  google:
    client-id: "${GOOGLE_CLIENT_ID:}"
    client-secret: "${GOOGLE_CLIENT_SECRET:}"

payos:
  client-id: "${PAYOS_CLIENT_ID:}"
  api-key: "${PAYOS_API_KEY:}"
  checksum-key: "${PAYOS_CHECKSUM_KEY:}"

app:
  mail:
    from: "${MAIL_FROM:no-reply@lms.local}"
    from-name: "${MAIL_FROM_NAME:eRIPT LMS}"
  frontend:
    base-url: "${FRONTEND_BASE_URL:http://localhost:3000}"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/lms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
